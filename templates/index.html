<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Academic Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .response-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
            white-space: pre-wrap;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Academic Assistant</h2>
        <textarea id="userQuery" placeholder="உங்கள் சந்தேகத்தை இங்கே கேட்கவும்..."></textarea>
        <button onclick="askAI()">கேள்வி கேட்க</button>
        <div id="loading" style="display:none; text-align:center; margin-top:10px;">பதில் தயார் செய்யப்படுகிறது...</div>
        <div class="response-box" id="responseBox" style="display:none;"></div>
    </div>

    <script>
        async function askAI() {
            const query = document.getElementById('userQuery').value.trim();
            const responseBox = document.getElementById('responseBox');
            const loading = document.getElementById('loading');

            if (!query) {
                alert('தயவுசெய்து கேள்வியை உள்ளிடவும்!');
                return;
            }

            loading.style.display = 'block';
            responseBox.style.display = 'none';
            responseBox.innerText = '';

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: query })
                });

                const data = await res.json();
                loading.style.display = 'none';
                responseBox.style.display = 'block';

                if (res.ok) {
                    responseBox.innerText = data.answer;
                } else {
                    responseBox.innerText = 'பிழை: ' + (data.error || 'தோல்வியடைந்தது');
                }
            } catch (err) {
                loading.style.display = 'none';
                responseBox.style.display = 'block';
                responseBox.innerText = 'இணைப்புப் பிழை: ' + err.message;
            }
        }
    </script>

</body>
</html>
